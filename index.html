<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tandem Portfolio</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet (Map view) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart.js (Compare view) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- D3 v7 (Access graph view) -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

    <!-- marked + DOMPurify (AI Chat markdown rendering) — pinned, with SRI -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
            integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"
            integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a"
            crossorigin="anonymous"></script>

    <!-- Tailwind config — matches tandem-sample-stats / tandem-sample-emb-viewer -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tandem-blue':          '#0696D7',
                        'tandem-dark':          '#0D2C54',
                        'dark-bg':              '#1a1a1a',
                        'dark-card':            '#2a2a2a',
                        'dark-border':          '#404040',
                        'dark-text':            '#e0e0e0',
                        'dark-text-secondary':  '#a0a0a0',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #505050; }

        /* AI Chat — rendered markdown (dark theme) */
        .chat-md { line-height: 1.5; overflow-wrap: anywhere; }
        .chat-md > *:first-child { margin-top: 0; }
        .chat-md > *:last-child  { margin-bottom: 0; }
        .chat-md p  { margin: 0.5rem 0; }
        .chat-md h1, .chat-md h2, .chat-md h3, .chat-md h4 { font-weight: 600; margin: 0.9rem 0 0.35rem; color: #fff; }
        .chat-md h1 { font-size: 1.15rem; }
        .chat-md h2 { font-size: 1.05rem; }
        .chat-md h3, .chat-md h4 { font-size: 0.95rem; }
        .chat-md ul, .chat-md ol { margin: 0.5rem 0; padding-left: 1.4rem; }
        .chat-md ul { list-style: disc; }
        .chat-md ol { list-style: decimal; }
        .chat-md li { margin: 0.15rem 0; }
        .chat-md strong { color: #fff; font-weight: 600; }
        .chat-md a { color: #0696D7; text-decoration: underline; }
        .chat-md hr { border: 0; border-top: 1px solid #404040; margin: 0.75rem 0; }
        .chat-md blockquote { border-left: 3px solid #404040; padding-left: 0.75rem; color: #a0a0a0; margin: 0.5rem 0; }
        .chat-md code { background: #1a1a1a; border: 1px solid #404040; border-radius: 4px; padding: 0.05rem 0.3rem; font-size: 0.85em; }
        .chat-md pre { background: #1a1a1a; border: 1px solid #404040; border-radius: 6px; padding: 0.6rem 0.75rem; margin: 0.5rem 0; overflow-x: auto; }
        .chat-md pre code { background: none; border: 0; padding: 0; }
        .chat-md .table-wrap { overflow-x: auto; margin: 0.5rem 0; }
        .chat-md table { border-collapse: collapse; font-size: 0.8rem; min-width: 50%; }
        .chat-md th, .chat-md td { border: 1px solid #404040; padding: 0.3rem 0.6rem; text-align: left; vertical-align: top; }
        .chat-md th { background: #1a1a1a; font-weight: 600; color: #fff; }
        .chat-md tr:nth-child(even) td { background: rgba(255,255,255,0.03); }

        /* Tab active state */
        .tab-btn.active {
            color: #0696D7;
            border-bottom: 2px solid #0696D7;
        }

        /* Skeleton shimmer */
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #2a2a2a 25%, #333 50%, #2a2a2a 75%);
            background-size: 800px 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 4px;
        }

        /* Facility card thumbnail area */
        .facility-thumbnail {
            height: 120px;
            object-fit: cover;
            width: 100%;
        }

        /* Leaflet map height */
        #map-container { height: 480px; }
    </style>
</head>
<body class="bg-dark-bg min-h-screen text-dark-text">

    <!-- ── Loading Overlay ────────────────────────────────────── -->
    <div id="loadingOverlay" class="fixed inset-0 bg-dark-bg bg-opacity-90 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="w-12 h-12 border-4 border-tandem-blue border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-dark-text-secondary text-sm">Loading…</p>
        </div>
    </div>

    <!-- ── Navigation Bar ─────────────────────────────────────── -->
    <nav class="bg-dark-card border-b border-dark-border sticky top-0 z-40">
        <div class="max-w-screen-xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-14">

                <!-- Logo + Title -->
                <div class="flex items-center space-x-3 shrink-0">
                    <div class="w-8 h-8 bg-tandem-blue rounded flex items-center justify-center">
                        <!-- Building grid icon -->
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                            <polyline stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </div>
                    <h1 class="text-base font-semibold text-dark-text">Tandem Portfolio</h1>
                </div>

                <!-- Account selector (hidden until logged in) -->
                <div id="controlBar" class="hidden flex items-center space-x-3">
                    <label for="accountSelect" class="text-xs font-medium text-dark-text-secondary shrink-0">Account</label>
                    <select id="accountSelect"
                            class="block w-48 rounded border border-dark-border bg-dark-bg text-dark-text text-xs py-1.5 px-2 focus:border-tandem-blue focus:outline-none">
                        <option value="">Select Account…</option>
                    </select>
                </div>

                <!-- User actions -->
                <div class="flex items-center space-x-2 shrink-0">
                    <button id="loginBtn"
                            class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded text-white bg-tandem-blue hover:bg-blue-600 focus:outline-none transition">
                        Sign In
                    </button>
                    <button id="logoutBtn"
                            class="hidden inline-flex items-center px-3 py-1.5 text-xs font-medium rounded text-dark-text-secondary border border-dark-border hover:bg-dark-card focus:outline-none transition">
                        Sign Out
                    </button>
                    <a id="userProfileLink" href="https://profile.autodesk.com" target="_blank" class="hidden">
                        <img id="userProfileImg" src="" alt="Profile" class="w-7 h-7 rounded-full border border-dark-border"/>
                    </a>
                    <a href="https://github.com/autodesk-tandem/tandem-sample-portfolio"
                       target="_blank"
                       rel="noopener noreferrer"
                       title="View source code on GitHub"
                       class="flex items-center justify-center h-8 w-8 rounded hover:bg-dark-border transition">
                        <img src="https://github.githubassets.com/favicons/favicon.png"
                             alt="GitHub Repository"
                             class="h-5 w-5 invert opacity-80 hover:opacity-100">
                    </a>
                </div>
            </div>

            <!-- Tab bar (hidden until logged in) -->
            <div id="tabBar" class="hidden flex space-x-1 -mb-px">
                <button data-tab="portfolio"
                        class="tab-btn active px-4 py-2.5 text-sm font-medium text-dark-text-secondary hover:text-dark-text transition border-b-2 border-transparent">
                    Portfolio
                </button>
                <button data-tab="map"
                        class="tab-btn px-4 py-2.5 text-sm font-medium text-dark-text-secondary hover:text-dark-text transition border-b-2 border-transparent">
                    Map
                </button>
                <button data-tab="access"
                        class="tab-btn px-4 py-2.5 text-sm font-medium text-dark-text-secondary hover:text-dark-text transition border-b-2 border-transparent">
                    Access
                </button>
                <button data-tab="compare"
                        class="tab-btn px-4 py-2.5 text-sm font-medium text-dark-text-secondary hover:text-dark-text transition border-b-2 border-transparent">
                    Compare
                </button>
                <button data-tab="activity"
                        class="tab-btn px-4 py-2.5 text-sm font-medium text-dark-text-secondary hover:text-dark-text transition border-b-2 border-transparent">
                    Activity
                </button>
                <button data-tab="tickets"
                        class="tab-btn px-4 py-2.5 text-sm font-medium text-dark-text-secondary hover:text-dark-text transition border-b-2 border-transparent">
                    Tickets
                </button>
                <button data-tab="accounts"
                        class="tab-btn px-4 py-2.5 text-sm font-medium text-dark-text-secondary hover:text-dark-text transition border-b-2 border-transparent">
                    Accounts
                </button>
                <button data-tab="chat"
                        class="tab-btn px-4 py-2.5 text-sm font-medium text-dark-text-secondary hover:text-dark-text transition border-b-2 border-transparent">
                    AI Chat
                </button>
            </div>
        </div>
    </nav>

    <!-- ── Welcome Screen (unauthenticated) ───────────────────── -->
    <div id="welcomeScreen" class="flex flex-col items-center justify-center min-h-[70vh] px-4">
        <div class="w-16 h-16 bg-tandem-blue bg-opacity-20 rounded-full flex items-center justify-center mb-6">
            <svg class="w-8 h-8 text-tandem-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                <polyline stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          points="9 22 9 12 15 12 15 22"/>
            </svg>
        </div>
        <h2 class="text-2xl font-semibold text-dark-text mb-2">Tandem Portfolio</h2>
        <p class="text-dark-text-secondary text-center max-w-md mb-8">
            View and compare all your Tandem facilities in one place. Sign in with your Autodesk account to get started.
        </p>
        <button onclick="document.getElementById('loginBtn').click()"
                class="inline-flex items-center px-5 py-2.5 text-sm font-medium rounded text-white bg-tandem-blue hover:bg-blue-600 focus:outline-none transition">
            Sign In with Autodesk
        </button>
    </div>

    <!-- ── App Content (authenticated) ───────────────────────── -->
    <main id="appContent" class="hidden max-w-screen-xl mx-auto px-4 sm:px-6 py-6">

        <!-- Portfolio View -->
        <div id="view-portfolio">
            <!-- Filter bar (rendered by portfolioView.js) -->
            <div id="filterBar" class="border-b border-dark-border mb-4"></div>

            <!-- Account metrics banner (rendered by portfolioView.js) -->
            <div id="accountMetricsBanner" class="mb-4"></div>

            <!-- Status bar -->
            <div class="flex items-center justify-between mb-4">
                <p id="portfolioStatus" class="text-xs text-dark-text-secondary"></p>
                <p id="portfolioCount" class="text-xs text-dark-text-secondary"></p>
            </div>

            <!-- Card grid (grid mode) -->
            <div id="facilityGrid"
                 class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- Facility cards rendered by portfolioView.js -->
            </div>

            <!-- Load more (grid mode only) -->
            <div id="loadMoreContainer" class="hidden text-center mt-8">
                <button id="loadMoreBtn"
                        class="px-5 py-2 text-sm font-medium rounded border border-dark-border text-dark-text-secondary hover:bg-dark-card transition">
                    Load more facilities
                </button>
            </div>

            <!-- Leaderboard (leaderboard mode) -->
            <div id="leaderboardContainer" class="hidden">
                <!-- metric picker + rows rendered by portfolioView.js -->
            </div>
        </div>

        <!-- Map View -->
        <div id="view-map" class="hidden">
            <div id="map-container" class="rounded border border-dark-border overflow-hidden"></div>
            <!-- Unlocated facilities panel rendered by mapView.js -->
            <div id="unlocatedPanel" class="mt-4"></div>
        </div>

        <!-- Access Graph View -->
        <div id="view-access" class="hidden">
            <!-- Rendered by accessView.js -->
            <div id="accessContent"></div>
        </div>

        <!-- Compare View -->
        <div id="view-compare" class="hidden">
            <!-- Rendered by comparisonView.js -->
            <div id="compareContent"></div>
        </div>

        <!-- Activity View -->
        <div id="view-activity" class="hidden">
            <!-- Rendered by activityView.js -->
            <div id="activityContent"></div>
        </div>

        <!-- Tickets View -->
        <div id="view-tickets" class="hidden">
            <!-- Rendered by ticketsView.js -->
            <div id="ticketsContent"></div>
        </div>

        <!-- AI Chat View -->
        <div id="view-chat" class="hidden">
            <!-- Rendered by chatView.js -->
            <div id="chatContent"></div>
        </div>

        <!-- Accounts View -->
        <div id="view-accounts" class="hidden">
            <!-- Rendered by accountsView.js -->
            <div id="accountsContent"></div>
        </div>

    </main>

    <!-- App entry point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
